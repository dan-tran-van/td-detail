      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </radialGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#airBg)"/>
  <!-- Charging Case -->
  <rect x="130" y="160" width="140" height="95" rx="30" fill="url(#caseGrad)" stroke="#475569" stroke-width="2"/>
  <line x1="130" y1="205" x2="270" y2="205" stroke="#1E293B" stroke-width="2"/>
  <circle cx="200" cy="225" r="3.5" fill="#D4AF37"/>
  <!-- Left Earbud floating -->
  <g transform="translate(100, 90)">
    <circle cx="35" cy="35" r="22" fill="#0F172A" stroke="#D4AF37" stroke-width="2"/>
    <path d="M35 48 L 30 85" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
    <circle cx="35" cy="35" r="8" fill="#D4AF37" opacity="0.8"/>
  </g>
  <!-- Right Earbud floating -->
  <g transform="translate(230, 90)">
    <circle cx="35" cy="35" r="22" fill="#0F172A" stroke="#D4AF37" stroke-width="2"/>
    <path d="M35 48 L 40 85" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
