<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="terraBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F7FEE7"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </radialGradient>
    <radialGradient id="violetGlass" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="60%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#terraBg)"/>
  <!-- Bottle 1 (Left - Hydrosol Spray) -->
  <g transform="translate(90, 110)">
    <rect x="18" y="0" width="14" height="20" rx="3" fill="#0F172A"/>
    <rect x="22" y="-8" width="6" height="8" fill="#94A3B8"/>
    <rect x="5" y="20" width="40" height="110" rx="10" fill="url(#violetGlass)"/>
    <rect x="12" y="55" width="26" height="45" rx="3" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="25" cy="72" r="4" fill="#059669"/>
  </g>
  <!-- Bottle 2 (Center - Face Oil Dropper) -->
  <g transform="translate(170, 95)">
    <!-- Dropper bulb -->
    <path d="M 23 0 C 18 -12, 42 -12, 37 0 Z" fill="#1E293B"/>
    <rect x="25" y="0" width="10" height="15" fill="#D4AF37"/>
    <rect x="5" y="15" width="50" height="125" rx="12" fill="url(#violetGlass)"/>
    <rect x="14" y="55" width="32" height="50" rx="3" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="30" cy="75" r="5" fill="#059669"/>
    <line x1="20" y1="88" x2="40" y2="88" stroke="#065F46" stroke-width="1.5"/>
  </g>
  <!-- Jar 3 (Right - Balm) -->
  <g transform="translate(250, 160)">
    <rect x="5" y="0" width="60" height="14" rx="4" fill="#D4AF37" stroke="#B45309" stroke-width="1"/>
    <rect x="5" y="14" width="60" height="60" rx="8" fill="url(#violetGlass)"/>
    <rect x="14" y="30" width="42" height="30" rx="3" fill="#FEF3C7" opacity="0.9"/>
    <line x1="22" y1="42" x2="48" y2="42" stroke="#065F46" stroke-width="1.5"/>
  </g>
  <text x="200" y="340" text-anchor="middle" fill="#065F46" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3">COLD-PRESSED SEED OILS • BIO-FLORA</text>
</svg>
