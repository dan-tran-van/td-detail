<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="monBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </radialGradient>
    <radialGradient id="kevlar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#monBg)"/>
  <!-- Monitor Cabinet 1 -->
  <g transform="translate(60, 90)">
    <rect width="125" height="200" rx="14" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <!-- Tweeter -->
    <circle cx="62" cy="55" r="22" fill="#020617" stroke="#64748B" stroke-width="2"/>
    <circle cx="62" cy="55" r="9" fill="#1E293B" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Woofer -->
    <circle cx="62" cy="135" r="42" fill="#020617" stroke="#475569" stroke-width="3"/>
    <circle cx="62" cy="135" r="32" fill="url(#kevlar)"/>
    <circle cx="62" cy="135" r="12" fill="#020617"/>
    <!-- LED indicator -->
    <circle cx="62" cy="186" r="2" fill="#D4AF37"/>
  </g>
  <!-- Monitor Cabinet 2 -->
  <g transform="translate(215, 90)">
    <rect width="125" height="200" rx="14" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <!-- Tweeter -->
    <circle cx="62" cy="55" r="22" fill="#020617" stroke="#64748B" stroke-width="2"/>
    <circle cx="62" cy="55" r="9" fill="#1E293B" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Woofer -->
    <circle cx="62" cy="135" r="42" fill="#020617" stroke="#475569" stroke-width="3"/>
    <circle cx="62" cy="135" r="32" fill="url(#kevlar)"/>
    <circle cx="62" cy="135" r="12" fill="#020617"/>
    <!-- LED indicator -->
    <circle cx="62" cy="186" r="2" fill="#D4AF37"/>
  </g>
  <text x="200" y="340" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3">BI-AMP CLASS-D • REFERENCE PAIR</text>
</svg>
