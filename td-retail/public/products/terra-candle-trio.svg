<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="terraBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F7FEE7"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </radialGradient>
    <radialGradient id="amberGlass" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#terraBg)"/>
  <!-- Candle 1 (Left, small) -->
  <g transform="translate(80, 160)">
    <!-- Flame -->
    <path d="M 35 15 C 30 0, 40 0, 35 -15 C 30 0, 40 0, 35 15" fill="url(#flame)"/>
    <line x1="35" y1="15" x2="35" y2="25" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <rect x="5" y="25" width="60" height="75" rx="8" fill="url(#amberGlass)"/>
    <rect x="15" y="45" width="40" height="40" rx="4" fill="#FEF3C7" opacity="0.85"/>
    <line x1="22" y1="60" x2="48" y2="60" stroke="#065F46" stroke-width="1.5"/>
    <line x1="25" y1="68" x2="45" y2="68" stroke="#065F46" stroke-width="1.5"/>
  </g>
  <!-- Candle 2 (Center, tall) -->
  <g transform="translate(160, 120)">
    <!-- Flame -->
    <path d="M 40 15 C 33 -5, 47 -5, 40 -20 C 33 -5, 47 -5, 40 15" fill="url(#flame)"/>
    <line x1="40" y1="15" x2="40" y2="28" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <rect x="5" y="28" width="70" height="115" rx="10" fill="url(#amberGlass)"/>
    <rect x="18" y="55" width="44" height="60" rx="4" fill="#FEF3C7" opacity="0.85"/>
    <circle cx="40" cy="75" r="7" fill="#059669"/>
    <line x1="26" y1="92" x2="54" y2="92" stroke="#065F46" stroke-width="1.5"/>
    <line x1="28" y1="100" x2="52" y2="100" stroke="#065F46" stroke-width="1.5"/>
  </g>
  <!-- Candle 3 (Right, medium) -->
  <g transform="translate(250, 145)">
    <!-- Flame -->
    <path d="M 35 15 C 30 0, 40 0, 35 -15 C 30 0, 40 0, 35 15" fill="url(#flame)"/>
    <line x1="35" y1="15" x2="35" y2="25" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <rect x="5" y="25" width="65" height="90" rx="8" fill="url(#amberGlass)"/>
    <rect x="16" y="50" width="42" height="48" rx="4" fill="#FEF3C7" opacity="0.85"/>
    <line x1="24" y1="68" x2="50" y2="68" stroke="#065F46" stroke-width="1.5"/>
    <line x1="26" y1="76" x2="48" y2="76" stroke="#065F46" stroke-width="1.5"/>
  </g>
  <!-- Botanical leaves spray -->
  <path d="M 70 310 Q 140 270 200 310 Q 260 270 330 310" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="140" cy="285" rx="8" ry="4" fill="#10B981" transform="rotate(-20 140 285)"/>
  <ellipse cx="260" cy="285" rx="8" ry="4" fill="#10B981" transform="rotate(20 260 285)"/>
  <text x="200" y="355" text-anchor="middle" fill="#065F46" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3">100% WILD SOY • WOOD WICK TRIO</text>
</svg>
