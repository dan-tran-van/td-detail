  </g>
  <text x="200" y="355" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3">9.1.4 DOLBY ATMOS • ISOBARIC SUB</text>
</svg>
