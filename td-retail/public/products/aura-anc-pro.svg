<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="auraBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="earcup" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#auraBg)"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#D4AF37" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#D4AF37" stroke-opacity="0.08"/>
  <!-- Headband -->
  <path d="M120 200 C 120 100, 280 100, 280 200" fill="none" stroke="#1E293B" stroke-width="20" stroke-linecap="round"/>
  <path d="M120 200 C 120 100, 280 100, 280 200" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Left earcup -->
  <g transform="translate(100, 180)">
    <rect x="-10" y="0" width="36" height="70" rx="18" fill="url(#earcup)" stroke="url(#goldGrad)" stroke-width="3"/>
    <ellipse cx="8" cy="35" rx="10" ry="24" fill="#0A0D14"/>
    <circle cx="8" cy="35" r="4" fill="#D4AF37"/>
  </g>
  <!-- Right earcup -->
  <g transform="translate(264, 180)">
    <rect x="-10" y="0" width="36" height="70" rx="18" fill="url(#earcup)" stroke="url(#goldGrad)" stroke-width="3"/>
    <ellipse cx="8" cy="35" rx="10" ry="24" fill="#0A0D14"/>
    <circle cx="8" cy="35" r="4" fill="#D4AF37"/>
  </g>
  <!-- Soundwave accents -->
  <path d="M170 300 Q 200 320 230 300" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <text x="200" y="350" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3">HORIZON ANC • 45MM BERYLLIUM</text>
</svg>
